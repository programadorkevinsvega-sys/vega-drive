name: Deploy Cloudflare

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.13
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.5
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply and commit Prettier formatting
        run: |
          pnpm exec prettier --write .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: apply Prettier formatting"
            git push origin HEAD:main
          fi
      - name: Deploy Worker and apply production migrations
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_URL: https://vega-drive.programadorkevinsvega.workers.dev
