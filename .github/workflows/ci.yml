name: CI

on:
  pull_request:
    branches: [main]
  # Validate every branch commit, including commits made before opening a PR.
  push:
    branches: ['**']
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      # For pull_request, checkout the synthetic merge commit. For push and
      # merge_group, checkout the exact commit GitHub is validating.
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.13
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.5
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install formatter dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify formatting
        run: pnpm run format:check

  verify:
    name: Verify
    needs: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.13
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.5
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Install frontend dependencies
        run: pnpm run frontend:install
      - name: Verify formatting, architecture, types and backend tests
        run: pnpm run check
      - name: Verify module architecture and migration boundaries
        run: pnpm run verify:architecture:all
      - name: Verify frontend types
        run: pnpm --dir frontend run typecheck
      - name: Run frontend tests
        run: pnpm --dir frontend run test
      - name: Audit root dependencies
        run: pnpm audit --audit-level=high
      - name: Audit frontend dependencies
        run: pnpm run frontend:audit
      - name: Apply migrations to an ephemeral local D1 database
        run: pnpm run db:migrate:local
      - name: Verify local D1 schema
        run: pnpm run db:verify:schema:local

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  required:
    name: Required checks
    if: always()
    needs: [format, verify, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to pass
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          test "$FORMAT_RESULT" = "success"
          test "$VERIFY_RESULT" = "success"
          test "$SECRETS_RESULT" = "success"
