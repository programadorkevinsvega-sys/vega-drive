name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:module-migrations
      - name: Apply D1 migrations to ephemeral local database
        run: pnpm run db:migrate:local
      - name: Verify local D1 schema
        run: pnpm run db:verify:schema:local
      - name: Temporary formatter preview
        run: |
          pnpm exec prettier --write .
          git diff -- frontend/src/services/files-transfer-direct.ts frontend/src/services/files-transfer-multipart.ts src/bff/routes/files-transfer-routes.ts src/modules/files/application/file-direct-uploads.ts src/modules/files/application/file-download-url.ts src/modules/files/infrastructure/storage/r2/r2-sigv4-presigner.ts tests/r2-sigv4-presigner.test.ts
      - run: pnpm run cloudflare:build
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
