name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Temporary preview formatting inspection
        run: |
          pnpm exec prettier --write FILES_PREVIEW.md frontend/src/screens/FilePreviewDialog.tsx frontend/src/screens/preview-format.ts src/modules/files/application/file-download-url.test.ts src/modules/files/application/file-download-url.ts src/modules/files/application/recent-activity.ts
          for file in FILES_PREVIEW.md frontend/src/screens/FilePreviewDialog.tsx frontend/src/screens/preview-format.ts src/modules/files/application/file-download-url.test.ts src/modules/files/application/file-download-url.ts src/modules/files/application/recent-activity.ts; do
            echo "BEGIN_FORMATTED_FILE:$file"
            cat "$file"
            echo "END_FORMATTED_FILE:$file"
          done
      - run: pnpm run verify:module-migrations
      - name: Apply D1 migrations to ephemeral local database
        run: pnpm run db:migrate:local
      - name: Verify local D1 schema
        run: pnpm run db:verify:schema:local
      - run: pnpm run cloudflare:build
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
