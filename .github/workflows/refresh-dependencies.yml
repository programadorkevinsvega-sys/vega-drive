name: One-time secure dependency refresh

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/refresh-dependencies.yml

permissions:
  contents: write

concurrency:
  group: secure-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.13
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.5
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            frontend/pnpm-lock.yaml
      - name: Update npm CLI
        run: npm install --global npm@12.2.2
      - name: Update all root dependencies
        run: pnpm update --latest -r
      - name: Update all frontend dependencies
        run: pnpm --dir frontend update --latest
      - name: Audit root dependencies
        run: pnpm audit --audit-level=moderate
      - name: Audit frontend dependencies
        run: pnpm --dir frontend --ignore-workspace audit --audit-level=moderate
      - name: Run complete Cloudflare build and verification
        run: pnpm run cloudflare:build
      - name: Commit updated manifests and lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml frontend/package.json frontend/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes were required."
          else
            git commit -m "chore(security): refresh dependencies and lockfiles"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
