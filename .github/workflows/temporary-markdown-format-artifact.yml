name: Temporary Markdown formatting artifact

on:
  push:
    branches:
      - docs/current-project-state-and-d1-time-travel

permissions:
  contents: read

jobs:
  format-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.28.13
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.5
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Format Markdown without committing changes
        run: pnpm exec prettier --write "**/*.md"
      - name: Export exact formatted files for manual review
        shell: bash
        run: |
          for file in README.md roadmap.md Rollback.md R2_DIRECT_TRANSFER_SETUP.md frontend/README.md POST_ROADMAP_DIRECT_R2_DELIVERY.md; do
            echo "DOC_START:$file"
            base64 -w0 "$file"
            echo
            echo "DOC_END:$file"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: formatted-markdown
          path: |
            **/*.md
            .github/**/*.md
          if-no-files-found: error
